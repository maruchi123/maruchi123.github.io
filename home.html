<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1A3A7A" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>Isuru Bag Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --pine:#1A3A7A; --pine-deep:#122A5C; --honey:#E0A340; --honey-deep:#C8862A;
      --ink:#12211F; --muted:#6B7C79; --line:#E4E8E6; --card:#FFF; --bg:#F1F4F2;
      --ok:#1E7A52; --radius:16px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100dvh;-webkit-font-smoothing:antialiased}

    .topbar{position:sticky;top:0;z-index:20;background:var(--pine);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
    .topbar .title{flex:1;min-width:0}
    .topbar .title h1{font-size:16px;font-weight:700;line-height:1.1}
    .topbar .title span{font-size:11.5px;color:rgba(255,255,255,.65)}
    .topbar .tb-btn{color:#fff;text-decoration:none;background:rgba(255,255,255,.14);border:none;cursor:pointer;border-radius:9px;display:flex;align-items:center;justify-content:center;width:36px;height:36px;flex:none}
    .topbar .tb-btn:hover{background:rgba(255,255,255,.22)}
    .topbar .tb-btn svg{width:19px;height:19px}

    .page{max-width:760px;margin:0 auto;padding:20px 16px 86px}
    .hello h2{font-size:21px;font-weight:800;letter-spacing:-.3px}
    .hello p{font-size:13.5px;color:var(--muted);margin-top:3px}

    .sec-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:22px 0 11px}

    .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .stat{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 4px 14px rgba(26,58,122,.05);transition:transform .08s,box-shadow .15s}
    .stat:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(26,58,122,.10)}
    .stat .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:11px}
    .stat .ic svg{width:20px;height:20px}
    .ic-honey{background:#FBF1DE;color:var(--honey-deep)}
    .ic-blue{background:#E7EDF9;color:var(--pine)}
    .ic-green{background:#E7F4EC;color:var(--ok)}
    .ic-purple{background:#F1EAF4;color:#6A4A86}
    .stat .num{font-size:26px;font-weight:800;line-height:1}
    .stat .lbl{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:600}

    .repstats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 14px rgba(26,58,122,.05);overflow:hidden;text-decoration:none;color:inherit}
    .repstats .rs{padding:15px 6px;text-align:center;border-right:1px solid var(--line)}
    .repstats .rs:last-child{border-right:none}
    .repstats .rs-num{font-size:23px;font-weight:800;line-height:1;color:var(--pine)}
    .repstats .rs-lbl{font-size:11px;color:var(--muted);margin-top:6px;font-weight:600}

    .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .action{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:14.5px;font-weight:700;color:#fff;background:var(--pine);border-radius:13px;padding:15px;box-shadow:0 4px 12px rgba(26,58,122,.15)}
    .action:hover{background:var(--pine-deep)}
    .action svg{width:18px;height:18px}

    .more{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .more a{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px}
    .more a:hover{background:#fafbfc}
    .more .mic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
    .more .mic svg{width:18px;height:18px}
    .more b{font-size:14px;font-weight:700}

    .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.06)}
    .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;padding:6px 2px;border-radius:10px}
    .tab svg{width:22px;height:22px}
    .tab.active{color:var(--pine)}
    .tab:active{background:var(--bg)}

    .gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;color:var(--muted)}
  </style>
</head>
<body>
  <div id="app" style="display:none">
    <div class="topbar">
      <div style="height:38px;background:#fff;border-radius:9px;padding:4px 8px;display:flex;align-items:center;flex:none" aria-hidden="true"><img src="logo.png" alt="Isuru Bag Center" style="height:100%;width:auto;display:block"></div>
      <div class="title"><h1>Isuru Bag Center</h1><span>Staff app</span></div>
      <a class="tb-btn" href="profile.html" aria-label="Profile"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="#fff" stroke-width="1.8"/><path d="M5.5 19a6.5 6.5 0 0 1 13 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></a>
    </div>

    <div class="page">
      <div class="hello">
        <h2 id="greeting">Welcome</h2>
        <p id="whoLabel"></p>
      </div>

      <div class="sec-label">Needs attention</div>
      <div class="stats">
        <a class="stat" href="reorders.html">
          <div class="ic ic-honey"><svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M5 12h14M5 17h9" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></div>
          <div class="num" id="statReorder">–</div>
          <div class="lbl">To reorder</div>
        </a>
        <a class="stat" href="repairs.html">
          <div class="ic ic-blue"><svg viewBox="0 0 24 24" fill="none"><path d="M3 7h4l1-2h8l1 2h4v12H3V7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></div>
          <div class="num" id="statFactory">–</div>
          <div class="lbl">At factory</div>
        </a>
        <a class="stat" href="repairs.html">
          <div class="ic ic-green"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="num" id="statReady">–</div>
          <div class="lbl">Ready for pickup</div>
        </a>
        <a class="stat" href="suggestions.html">
          <div class="ic ic-purple"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3a6 6 0 0 0-4 10c1 .9 1.5 1.6 1.5 3h5c0-1.4.5-2.1 1.5-3A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 21h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
          <div class="num" id="statSug">–</div>
          <div class="lbl">New ideas</div>
        </a>
      </div>

      <div class="sec-label">Repairs completed</div>
      <a class="repstats" href="repairs.html">
        <div class="rs"><div class="rs-num" id="repToday">–</div><div class="rs-lbl">Today</div></div>
        <div class="rs"><div class="rs-num" id="repWeek">–</div><div class="rs-lbl">This week</div></div>
        <div class="rs"><div class="rs-num" id="repMonth">–</div><div class="rs-lbl">This month</div></div>
        <div class="rs"><div class="rs-num" id="repTotal">–</div><div class="rs-lbl">All time</div></div>
      </a>

      <div class="sec-label">Quick actions</div>
      <div class="actions">
        <a class="action" href="repairs.html?new=1"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>New repair</a>
        <a class="action" href="reorders.html?new=1"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>New reorder</a>
      </div>

      <div class="sec-label">More</div>
      <div class="more">
        <a href="catalog.html">
          <div class="mic ic-blue"><svg viewBox="0 0 24 24" fill="none"><path d="M5 8h14l-1 12H6L5 8Z" stroke="currentColor" stroke-width="1.7"/><path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div>
          <b>Catalog</b>
        </a>
        <a href="suggestions.html">
          <div class="mic ic-purple"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3a6 6 0 0 0-4 10c1 .9 1.5 1.6 1.5 3h5c0-1.4.5-2.1 1.5-3A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 21h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
          <b>Suggestions</b>
        </a>
        <a href="supplies.html">
          <div class="mic ic-honey"><svg viewBox="0 0 24 24" fill="none"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 7.5 12 12l9-4.5M12 12v9" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
          <b>Supplies</b>
        </a>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <a href="home.html" class="tab active"><svg viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7M6 10v9h5v-6h2v6h5v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Home</span></a>
    <a href="catalog.html" class="tab"><svg viewBox="0 0 24 24" fill="none"><path d="M5 8h14l-1 12H6L5 8Z" stroke="currentColor" stroke-width="1.7"/><path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span>Catalog</span></a>
    <a href="reorders.html" class="tab"><svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M5 12h14M5 17h9" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span>Reorders</span></a>
    <a href="repairs.html" class="tab"><svg viewBox="0 0 24 24" fill="none"><path d="M14 4l6 6-9 9-6 1 1-6 8-10Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><span>Repairs</span></a>
  </nav>

  <div class="gate" id="gate" style="display:none">Taking you to sign in…</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, query, where, getCountFromServer, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA6n390v89kO0PStNVDv7PeEpWvAqQUVhA",
      authDomain: "isuru-bag-center.firebaseapp.com",
      projectId: "isuru-bag-center",
      storageBucket: "isuru-bag-center.firebasestorage.app",
      messagingSenderId: "135197885479",
      appId: "1:135197885479:web:b207e35730085761c13a02"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, (user) => {
      if(user){
        document.getElementById('app').style.display = 'block';
        document.getElementById('gate').style.display = 'none';
        const name = user.displayName ? user.displayName : '';
        const h = new Date().getHours();
        const part = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
        document.getElementById('greeting').textContent = name ? `${part}, ${name}` : part;
        document.getElementById('whoLabel').textContent = user.email;
        loadCounts();
        loadRepairStats();
      }else{
        document.getElementById('app').style.display = 'none';
        document.getElementById('gate').style.display = 'flex';
        window.location.href = 'index.html';
      }
    });

    function set(id, v){ document.getElementById(id).textContent = v; }

    async function loadCounts(){
      try{
        const [r, f, rd, s] = await Promise.all([
          getCountFromServer(query(collection(db,'reorders'), where('status','in',['requested','approved','dispatched','partial']))),
          getCountFromServer(query(collection(db,'repairs'),  where('status','==','atFactory'))),
          getCountFromServer(query(collection(db,'repairs'),  where('status','==','ready'))),
          getCountFromServer(query(collection(db,'suggestions'), where('status','==','submitted')))
        ]);
        set('statReorder', r.data().count);
        set('statFactory', f.data().count);
        set('statReady', rd.data().count);
        set('statSug', s.data().count);
      }catch(e){
        ['statReorder','statFactory','statReady','statSug'].forEach(id=>set(id,'–'));
      }
    }
    async function loadRepairStats(){
      try{
        const snap = await getDocs(query(collection(db,'repairs'), where('status','==','collected')));
        const now = new Date();
        const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const startWeek  = new Date(startToday); startWeek.setDate(startToday.getDate() - ((startToday.getDay()+6)%7)); // Monday start
        const startMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        let total=0, today=0, week=0, month=0;
        snap.forEach(d=>{
          total++;
          const ts = d.data().collectedAt;
          if(ts && ts.toDate){
            const dt = ts.toDate();
            if(dt>=startToday) today++;
            if(dt>=startWeek)  week++;
            if(dt>=startMonth) month++;
          }
        });
        set('repToday',today); set('repWeek',week); set('repMonth',month); set('repTotal',total);
      }catch(e){
        ['repToday','repWeek','repMonth','repTotal'].forEach(id=>set(id,'–'));
      }
    }
  </script>
</body>
</html>
