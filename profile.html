<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1A3A7A" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>Profile · Isuru Bag Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--pine:#1A3A7A;--pine-deep:#122A5C;--pine-soft:#3E63B5;--honey:#E0A340;--ink:#12211F;--muted:#6B7C79;--line:#E4E8E6;--card:#FFF;--field:#F5F7F6;--bg:#F1F4F2;--ok:#1E7A52;--danger:#B23B3B;--danger-bg:#FBEDED;--radius:16px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100dvh;-webkit-font-smoothing:antialiased}
    .topbar{position:sticky;top:0;z-index:20;background:var(--pine);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
    .topbar a.back{color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.14)}
    .topbar a.back svg{width:18px;height:18px}
    .topbar h1{font-size:16px;font-weight:700}

    .page{max-width:520px;margin:0 auto;padding:18px 16px 40px}
    .avatar{width:72px;height:72px;border-radius:50%;background:var(--pine);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;margin:6px auto 8px}
    .email{text-align:center;font-size:14px;color:var(--muted);margin-bottom:22px;word-break:break-all}

    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 14px rgba(26,58,122,.05)}
    .card h2{font-size:15px;font-weight:700;margin-bottom:14px}
    .lbl{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px}
    .inp{width:100%;font-family:inherit;font-size:15px;padding:12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);margin-bottom:14px}
    .inp:focus{outline:none;border-color:var(--pine-soft);box-shadow:0 0 0 3px rgba(62,99,181,.12)}
    .btn{width:100%;font-family:inherit;font-size:14.5px;font-weight:700;color:#fff;background:var(--pine);border:none;border-radius:12px;padding:13px;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:center;gap:9px}
    .btn:hover{background:var(--pine-deep)}
    .btn:disabled{background:var(--muted)}
    .spinner{width:17px;height:17px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;display:none}
    @keyframes spin{to{transform:rotate(360deg)}}

    .msg{display:none;font-size:13px;font-weight:500;padding:10px 12px;border-radius:10px;margin-bottom:14px}
    .msg.ok{background:#E7F4EC;color:var(--ok);border:1px solid #CDE9D8}
    .msg.err{background:var(--danger-bg);color:var(--danger);border:1px solid #F3D6D6}

    .signout{width:100%;font-family:inherit;font-size:14.5px;font-weight:700;color:var(--danger);background:#fff;border:1.5px solid #F0D6D6;border-radius:12px;padding:14px;cursor:pointer;min-height:50px}
    .signout:hover{background:var(--danger-bg)}

    .gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;color:var(--muted)}
    @media (prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
</head>
<body>
  <div id="app" style="display:none">
    <div class="topbar">
      <a class="back" href="home.html" aria-label="Home"><svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <h1>Profile</h1>
    </div>

    <div class="page">
      <div class="avatar" id="avatar">?</div>
      <div class="email" id="email"></div>

      <div class="card">
        <h2>Your name</h2>
        <div class="msg" id="nameMsg"></div>
        <label class="lbl" for="nameInput">Display name</label>
        <input class="inp" id="nameInput" type="text" placeholder="e.g. Nimal" />
        <button class="btn" id="saveNameBtn"><span class="spinner" id="nameSpin"></span><span id="nameText">Save name</span></button>
      </div>

      <div class="card">
        <h2>Change password</h2>
        <div class="msg" id="passMsg"></div>
        <label class="lbl" for="newPass">New password</label>
        <input class="inp" id="newPass" type="password" autocomplete="new-password" placeholder="At least 6 characters" />
        <label class="lbl" for="confirmPass">Confirm new password</label>
        <input class="inp" id="confirmPass" type="password" autocomplete="new-password" placeholder="Type it again" />
        <button class="btn" id="savePassBtn"><span class="spinner" id="passSpin"></span><span id="passText">Update password</span></button>
      </div>

      <button class="signout" id="signoutBtn">Sign out</button>
    </div>
  </div>

  <div class="gate" id="gate" style="display:none">Taking you to sign in…</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, updateProfile, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA6n390v89kO0PStNVDv7PeEpWvAqQUVhA",
      authDomain: "isuru-bag-center.firebaseapp.com",
      projectId: "isuru-bag-center",
      storageBucket: "isuru-bag-center.firebasestorage.app",
      messagingSenderId: "135197885479",
      appId: "1:135197885479:web:b207e35730085761c13a02"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let currentUser = null;
    onAuthStateChanged(auth, (user) => {
      if(user){
        currentUser = user;
        document.getElementById('app').style.display = 'block';
        document.getElementById('gate').style.display = 'none';
        document.getElementById('email').textContent = user.email;
        document.getElementById('nameInput').value = user.displayName || '';
        const base = (user.displayName || user.email || '?').trim();
        document.getElementById('avatar').textContent = base.charAt(0).toUpperCase();
      }else{
        document.getElementById('app').style.display = 'none';
        document.getElementById('gate').style.display = 'flex';
        window.location.href = 'index.html';
      }
    });

    function show(el, type, text){ el.className = 'msg ' + type; el.textContent = text; el.style.display = 'block'; }
    function busy(btn, spin, txtEl, on, label, normal){ btn.disabled = on; spin.style.display = on?'block':'none'; txtEl.textContent = on?label:normal; }

    // ---- Save name ----
    const saveNameBtn=document.getElementById('saveNameBtn');
    saveNameBtn.addEventListener('click', async ()=>{
      const nameMsg=document.getElementById('nameMsg'); nameMsg.style.display='none';
      const name=document.getElementById('nameInput').value.trim();
      busy(saveNameBtn, document.getElementById('nameSpin'), document.getElementById('nameText'), true, 'Saving…', 'Save name');
      try{
        await updateProfile(currentUser, { displayName: name });
        document.getElementById('avatar').textContent = (name || currentUser.email).charAt(0).toUpperCase();
        show(nameMsg, 'ok', 'Name saved.');
      }catch(e){ show(nameMsg, 'err', e.message || 'Could not save name.'); }
      finally{ busy(saveNameBtn, document.getElementById('nameSpin'), document.getElementById('nameText'), false, '', 'Save name'); }
    });

    // ---- Change password ----
    const savePassBtn=document.getElementById('savePassBtn');
    savePassBtn.addEventListener('click', async ()=>{
      const passMsg=document.getElementById('passMsg'); passMsg.style.display='none';
      const p1=document.getElementById('newPass').value;
      const p2=document.getElementById('confirmPass').value;
      if(p1.length<6){ show(passMsg,'err','Password must be at least 6 characters.'); return; }
      if(p1!==p2){ show(passMsg,'err','The two passwords do not match.'); return; }
      busy(savePassBtn, document.getElementById('passSpin'), document.getElementById('passText'), true, 'Updating…', 'Update password');
      try{
        await updatePassword(currentUser, p1);
        document.getElementById('newPass').value=''; document.getElementById('confirmPass').value='';
        show(passMsg,'ok','Password updated. Use it next time you sign in.');
      }catch(e){
        if(e.code==='auth/requires-recent-login'){
          show(passMsg,'err','For security, please sign out and sign back in, then change your password.');
        }else{
          show(passMsg,'err', e.message || 'Could not update password.');
        }
      }finally{ busy(savePassBtn, document.getElementById('passSpin'), document.getElementById('passText'), false, '', 'Update password'); }
    });

    document.getElementById('signoutBtn').addEventListener('click', ()=> signOut(auth).then(()=>window.location.href='index.html'));
  </script>
</body>
</html>
