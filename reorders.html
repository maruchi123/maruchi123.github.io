<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1A3A7A" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>Reorders · Isuru Bag Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --pine:#1A3A7A; --pine-deep:#122A5C; --pine-soft:#3E63B5;
      --honey:#E0A340; --honey-deep:#C8862A;
      --ink:#12211F; --muted:#6B7C79; --line:#E4E8E6;
      --card:#FFF; --field:#F5F7F6; --bg:#F1F4F2;
      --danger:#B23B3B; --danger-bg:#FBEDED; --ok:#1E7A52;
      --radius:16px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100dvh;-webkit-font-smoothing:antialiased}

    /* top bar */
    .topbar{position:sticky;top:0;z-index:20;background:var(--pine);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
    .topbar a.back{color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.14)}
    .topbar a.back:hover{background:rgba(255,255,255,.22)}
    .topbar a.back svg{width:18px;height:18px}
    .topbar .title{flex:1;min-width:0}
    .topbar .title h1{font-size:16px;font-weight:700;line-height:1.1}
    .topbar .title span{font-size:11.5px;color:rgba(255,255,255,.65)}
    .topbar button{font-family:inherit;font-size:12.5px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);border:none;border-radius:9px;padding:8px 11px;cursor:pointer}
    .topbar button:hover{background:rgba(255,255,255,.22)}

    .page{max-width:760px;margin:0 auto;padding:16px 16px 86px}

    .newbtn{width:100%;font-family:inherit;font-size:15px;font-weight:700;color:#fff;background:var(--pine);border:none;border-radius:12px;padding:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:18px}
    .newbtn:hover{background:#142E61}
    .newbtn svg{width:18px;height:18px}

    /* form */
    .form-card{display:none;background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:18px;border:1px solid var(--line);box-shadow:0 6px 20px rgba(26,58,122,.06)}
    .form-card.open{display:block}
    .form-card h2{font-size:16px;font-weight:700;margin-bottom:6px}
    .form-card .needed{font-size:12.5px;color:var(--honey-deep);font-weight:600;margin-bottom:16px}

    .form-msg{display:none;font-size:13px;font-weight:500;padding:10px 12px;border-radius:10px;margin-bottom:14px;background:var(--danger-bg);color:var(--danger);border:1px solid #F3D6D6}

    .seg{display:flex;background:var(--field);border-radius:11px;padding:4px;margin-bottom:16px}
    .seg button{flex:1;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);background:none;border:none;border-radius:8px;padding:9px;cursor:pointer}
    .seg button.active{background:#fff;color:var(--pine);box-shadow:0 1px 3px rgba(0,0,0,.08)}

    .lbl{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px}
    .inp{width:100%;font-family:inherit;font-size:15px;padding:12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);margin-bottom:14px}
    .inp:focus{outline:none;border-color:var(--pine-soft);box-shadow:0 0 0 3px rgba(62,99,181,.10)}
    textarea.inp{resize:vertical;min-height:64px}
    .help{font-size:11.5px;color:var(--muted);margin:-9px 0 14px}

    /* catalog picker */
    .picker-search{position:relative;margin-bottom:12px}
    .picker-search input{width:100%;font-family:inherit;font-size:15px;padding:12px 12px 12px 38px;border:1.5px solid var(--line);border-radius:11px;background:#fff}
    .picker-search input:focus{outline:none;border-color:var(--pine-soft)}
    .picker-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
    .picker-list{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:11px;margin-bottom:14px}
    .pick-item{display:flex;align-items:center;gap:11px;padding:9px 11px;cursor:pointer;border-bottom:1px solid var(--line)}
    .pick-item:last-child{border-bottom:none}
    .pick-item:hover{background:var(--field)}
    .pick-item.sel{background:#E7EDF9}
    .pick-item img,.pick-item .nopic{width:42px;height:42px;border-radius:8px;object-fit:cover;flex:none;background:var(--field)}
    .pick-item .nopic{display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted)}
    .pick-item .pi-name{font-size:14px;font-weight:600}
    .pick-item .pi-code{font-size:11.5px;color:var(--muted)}
    .picker-empty{padding:18px;text-align:center;font-size:13px;color:var(--muted)}

    /* new-item photo */
    .photo-pick{border:2px dashed var(--line);border-radius:14px;padding:20px;text-align:center;cursor:pointer;background:var(--field);margin-bottom:14px}
    .photo-pick:hover{border-color:var(--pine-soft)}
    .photo-pick svg{width:28px;height:28px;color:var(--muted);margin-bottom:6px}
    .photo-pick p{font-size:13px;color:var(--muted);font-weight:500}
    .photo-pick .hint{font-size:11px;margin-top:2px}
    .photo-pick img{max-width:100%;max-height:200px;border-radius:10px;display:block;margin:0 auto}

    /* selected catalog item banner */
    .selected-banner{display:none;align-items:center;gap:11px;background:#E7EDF9;border-radius:11px;padding:10px 12px;margin-bottom:14px}
    .selected-banner img,.selected-banner .nopic{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:#fff}
    .selected-banner .nopic{display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted)}
    .selected-banner .sb-name{font-size:14px;font-weight:700;flex:1}
    .selected-banner .sb-clear{font-size:12px;font-weight:600;color:var(--pine);background:none;border:none;cursor:pointer}

    .color-chips{display:flex;flex-wrap:wrap;gap:7px;margin:-7px 0 14px}
    .color-chips .cc{font-size:12px;font-weight:600;color:var(--pine);background:#E7EDF9;border:1px solid #CDD9F2;border-radius:20px;padding:5px 11px;cursor:pointer}
    .color-chips .cc:hover{background:#DCE6F8}

    .row2{display:flex;gap:12px}
    .row2 > div{flex:1}

    .form-actions{display:flex;gap:10px;margin-top:4px}
    .btn-primary{flex:1;font-family:inherit;font-size:15px;font-weight:700;color:#fff;background:var(--pine);border:none;border-radius:12px;padding:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;min-height:50px}
    .btn-primary:hover{background:#142E61}
    .btn-primary:disabled{background:var(--muted);cursor:default}
    .btn-cancel{flex:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 18px;cursor:pointer}
    .btn-cancel:hover{background:var(--field)}
    .spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;display:none}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* filter tabs */
    .filters{display:flex;gap:8px;margin-bottom:14px}
    .filters button{font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:7px 15px;cursor:pointer}
    .filters button.active{color:#fff;background:var(--pine);border-color:var(--pine)}

    /* request cards */
    .req{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px;box-shadow:0 4px 14px rgba(26,58,122,.05)}
    .req-top{display:flex;gap:12px}
    .req-top img,.req-top .nopic{width:60px;height:60px;border-radius:10px;object-fit:cover;flex:none;background:var(--field)}
    .req-top .nopic{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted)}
    .req-info{flex:1;min-width:0}
    .req-name{font-size:15px;font-weight:700;line-height:1.2}
    .req-meta{font-size:12.5px;color:var(--muted);margin-top:3px}
    .req-qty{font-size:13.5px;font-weight:700;color:var(--pine);margin-top:5px}
    .req-notes{font-size:12.5px;color:var(--ink);background:var(--field);border-radius:8px;padding:7px 9px;margin-top:9px}
    .badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:20px;padding:4px 10px;flex:none}
    .b-requested{background:#EAEFF6;color:#3A5A86}
    .b-approved{background:#E7EDF9;color:var(--pine)}
    .b-dispatched{background:#FBF1DE;color:var(--honey-deep)}
    .b-received{background:#E7F4EC;color:var(--ok)}
    .b-short{background:var(--danger-bg);color:var(--danger);margin-left:6px}
    .b-partial{background:#FCEFD9;color:#B5701A}
    .b-supply{background:#EDE9F6;color:#6A4A86;margin-left:6px}

    .req-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
    .stamp{font-size:11px;color:var(--muted);line-height:1.4}
    .act{font-family:inherit;font-size:12.5px;font-weight:700;color:#fff;background:var(--pine);border:none;border-radius:9px;padding:9px 13px;cursor:pointer;flex:none}
    .act:hover{background:#142E61}
    .act.secondary{background:#fff;color:var(--pine);border:1.5px solid var(--line)}
    .act.secondary:hover{background:var(--field)}
    .req-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

    /* send / download list bar */
    .listbar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:16px;box-shadow:0 4px 14px rgba(26,58,122,.05)}
    .listbar .lb-info{font-size:13px;color:var(--muted);margin-bottom:11px}
    .listbar .lb-info strong{color:var(--pine);font-size:16px}
    .listbar .lb-actions{display:flex;gap:9px}
    .listbar .lb-actions button{flex:1;font-family:inherit;font-size:13.5px;font-weight:700;border-radius:10px;padding:11px 8px;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:7px}
    .listbar .lb-actions svg{width:16px;height:16px}
    .lb-wa{background:#25D366;color:#fff}
    .lb-wa:hover{background:#1faa53}
    .lb-img{background:var(--field);color:var(--pine);border:1.5px solid var(--line)!important}
    .lb-img:hover{background:#E7EDF9}
    .lb-print{background:var(--pine);color:#fff}
    .lb-print:hover{background:#142E61}

    .recv-form{display:none;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);gap:9px;align-items:flex-end}
    .recv-form.open{display:flex}
    .recv-form .f{flex:1}
    .recv-form label{font-size:11.5px;font-weight:600;display:block;margin-bottom:5px}
    .recv-form input{width:100%;font-family:inherit;font-size:15px;padding:10px;border:1.5px solid var(--line);border-radius:10px}

    .state{text-align:center;padding:44px 20px;color:var(--muted)}
    .state h3{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:5px}
    .state p{font-size:13.5px}

    .gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
    .gate p{color:var(--muted)}
    @media (prefers-reduced-motion:reduce){.spinner{animation:none}}
    /* ---- bottom tab bar ---- */
    .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.06)}
    .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;padding:6px 2px;border-radius:10px}
    .tab svg{width:22px;height:22px}
    .tab.active{color:var(--pine)}
    .tab:active{background:var(--bg)}

    /* ---- printable reorder list (80mm thermal) ---- */
    @media screen { #printArea{display:none} }
    @media print{
      body{background:#fff}
      body > *:not(#printArea){display:none !important}
      #printArea{display:block !important;margin:0;padding:0}
      .pl-doc{max-width:300px;margin:0 auto;font-family:'Plus Jakarta Sans',sans-serif;color:#000;line-height:1.4}
      .pl-logo{display:block;width:120px;max-width:62%;margin:0 auto 6px}
      .pl-head{text-align:center;border-bottom:1px dashed #444;padding-bottom:8px;margin-bottom:8px}
      .pl-head h1{font-size:17px;font-weight:800;line-height:1.15}
      .pl-head p{font-size:10.5px;color:#222;margin-top:3px;line-height:1.35}
      .pl-title{text-align:center;font-weight:800;font-size:14px;letter-spacing:.5px}
      .pl-date{text-align:center;font-size:11px;color:#222;margin:2px 0 10px}
      .pl-item{padding:6px 0;border-bottom:1px dashed #bbb}
      .pl-item .nm{font-weight:700;font-size:12.5px}
      .pl-item .dt{font-size:11.5px;margin-top:2px}
      .pl-item .nt{font-size:11px;font-style:italic;margin-top:2px;color:#333}
      .pl-total{margin-top:10px;font-weight:800;font-size:13px;text-align:center}
      .pl-deliver{text-align:center;font-size:11.5px;margin-top:4px;border-top:1px dashed #444;padding-top:8px}
      .pl-sign{margin-top:16px;font-size:11px;line-height:2.6}
    }
  </style>
</head>
<body>
  <div id="app" style="display:none">
    <div class="topbar">
      <a class="back" href="home.html" aria-label="Home"><svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <div class="title"><h1>Reorders</h1><span>Isuru Bag Center</span></div>
      <button id="logoutBtn">Sign out</button>
    </div>

    <div class="page">
      <button class="newbtn" id="toggleNew">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
        New request
      </button>

      <!-- form -->
      <div class="form-card" id="formCard">
        <h2>Request a product</h2>
        <p class="needed" id="neededLabel"></p>
        <div class="form-msg" id="formMsg"></div>

        <div class="seg">
          <button id="segCatalog" class="active">From catalog</button>
          <button id="segNew">New item</button>
        </div>

        <!-- CATALOG MODE -->
        <div id="catalogMode">
          <div class="selected-banner" id="selectedBanner">
            <span id="sbImg"></span>
            <span class="sb-name" id="sbName"></span>
            <button class="sb-clear" id="sbClear">Change</button>
          </div>
          <div id="pickerArea">
            <div class="picker-search">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              <input id="pickerSearch" type="text" placeholder="Search your catalog…" />
            </div>
            <div class="picker-list" id="pickerList"></div>
          </div>
        </div>

        <!-- NEW ITEM MODE -->
        <div id="newMode" style="display:none">
          <input type="file" id="photoInput" accept="image/*" style="display:none" />
          <div class="photo-pick" id="photoPick">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.5-2h7L17 8h3v11H4V8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.8"/></svg>
            <p>Tap to add a photo</p>
            <p class="hint">Take a photo or choose from gallery</p>
          </div>
          <label class="lbl" for="newName">Bag name</label>
          <input class="inp" id="newName" type="text" placeholder="e.g. School bag — blue" />
          <label class="lbl" for="newCode">Item code <span style="color:var(--muted);font-weight:500">(optional)</span></label>
          <input class="inp" id="newCode" type="text" placeholder="e.g. SB-112" />
          <p class="help">This new bag will also be saved to your catalog, so next time you just tap it.</p>
        </div>

        <!-- shared fields -->
        <div id="colorChips" class="color-chips"></div>
        <div class="row2">
          <div>
            <label class="lbl" for="qtyInput">Quantity</label>
            <input class="inp" id="qtyInput" type="number" min="1" placeholder="e.g. 10" />
          </div>
          <div>
            <label class="lbl" for="colorInput">Colour</label>
            <input class="inp" id="colorInput" type="text" placeholder="e.g. black" />
          </div>
        </div>
        <label class="lbl" for="notesInput">Special notes <span style="color:var(--muted);font-weight:500">(optional)</span></label>
        <textarea class="inp" id="notesInput" placeholder="Anything the warehouse should know…"></textarea>

        <div class="form-actions">
          <button class="btn-primary" id="saveBtn"><span class="spinner" id="saveSpinner"></span><span id="saveText">Add to tomorrow's list</span></button>
          <button class="btn-cancel" id="cancelBtn">Cancel</button>
        </div>
      </div>

      <!-- send / download today's list -->
      <div class="listbar" id="listBar" style="display:none">
        <div class="lb-info"><strong id="lbCount">0</strong> pending items to send to the warehouse</div>
        <div class="lb-actions">
          <button class="lb-wa" id="sendWaBtn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.6-.6-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 .9-2.2.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.1.1.3 0 .5l-.4.5-.3.3c-.1.1-.3.3-.1.5.1.3.6 1.1 1.4 1.8 1 .9 1.8 1.1 2 1.2.2.1.4.1.5-.1l.7-.8c.2-.2.3-.2.6-.1l1.9.9c.3.1.4.2.5.3.1.2.1.6-.1 1.1Z"/></svg>
            WhatsApp
          </button>
          <button class="lb-print" id="printListBtn">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8v-7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            Print
          </button>
          <button class="lb-img" id="saveImgBtn">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Image
          </button>
        </div>
      </div>

      <!-- filters -->
      <div class="filters">
        <button data-f="pending" class="active">Pending</button>
        <button data-f="received">Received</button>
        <button data-f="all">All</button>
      </div>

      <!-- list -->
      <div id="listWrap"><div class="state"><p>Loading…</p></div></div>
    </div>
  </div>

  <nav class="tabbar">
    <a href="home.html" class="tab"><svg viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7M6 10v9h5v-6h2v6h5v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Home</span></a>
    <a href="catalog.html" class="tab"><svg viewBox="0 0 24 24" fill="none"><path d="M5 8h14l-1 12H6L5 8Z" stroke="currentColor" stroke-width="1.7"/><path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span>Catalog</span></a>
    <a href="reorders.html" class="tab active"><svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M5 12h14M5 17h9" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span>Reorders</span></a>
    <a href="repairs.html" class="tab"><svg viewBox="0 0 24 24" fill="none"><path d="M14 4l6 6-9 9-6 1 1-6 8-10Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><span>Repairs</span></a>
  </nav>

  <div class="gate" id="gate" style="display:none"><p>Taking you to sign in…</p></div>

  <div id="printArea"></div>

  <script src="config.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA6n390v89kO0PStNVDv7PeEpWvAqQUVhA",
      authDomain: "isuru-bag-center.firebaseapp.com",
      projectId: "isuru-bag-center",
      storageBucket: "isuru-bag-center.firebasestorage.app",
      messagingSenderId: "135197885479",
      appId: "1:135197885479:web:b207e35730085761c13a02",
      measurementId: "G-6ZW4E68EL4"
    };
    const IMGBB_KEY = window.IMGBB_KEY;  // comes from config.js

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let catalogItems = [];
    let reorders = [];
    let currentFilter = 'pending';
    let mode = 'catalog';          // 'catalog' | 'new'
    let selectedCatalogItem = null;
    let selectedFile = null;

    // ---- auth ----
    onAuthStateChanged(auth, (user) => {
      if(user){
        currentUser = user;
        document.getElementById('app').style.display = 'block';
        document.getElementById('gate').style.display = 'none';
        document.getElementById('neededLabel').textContent = 'Needed by: ' + niceDate(tomorrowISO());
        loadCatalog();
        loadReorders();
      }else{
        document.getElementById('app').style.display = 'none';
        document.getElementById('gate').style.display = 'flex';
        window.location.href = 'index.html';
      }
    });
    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth).then(()=>window.location.href='index.html'));

    // ---- dates ----
    function tomorrowISO(){ const d=new Date(); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); }
    function niceDate(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}); }
    function timeAgo(ts){
      if(!ts || !ts.toDate) return '';
      const d = ts.toDate();
      return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}) + ' ' +
             d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
    }
    function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    // ---- form open/close ----
    const formCard = document.getElementById('formCard');
    document.getElementById('toggleNew').addEventListener('click', ()=>{
      formCard.classList.toggle('open');
      if(formCard.classList.contains('open')) formCard.scrollIntoView({behavior:'smooth'});
    });
    document.getElementById('cancelBtn').addEventListener('click', resetForm);

    // ---- mode switch ----
    const segCatalog = document.getElementById('segCatalog');
    const segNew = document.getElementById('segNew');
    segCatalog.addEventListener('click', ()=>setMode('catalog'));
    segNew.addEventListener('click', ()=>setMode('new'));
    function setMode(m){
      mode = m;
      segCatalog.classList.toggle('active', m==='catalog');
      segNew.classList.toggle('active', m==='new');
      document.getElementById('catalogMode').style.display = m==='catalog' ? 'block':'none';
      document.getElementById('newMode').style.display = m==='new' ? 'block':'none';
    }

    // ---- catalog load + picker ----
    async function loadCatalog(){
      try{
        const snap = await getDocs(query(collection(db,'catalog'), orderBy('createdAt','desc')));
        catalogItems = snap.docs.map(d=>({id:d.id, ...d.data()}));
        renderPicker(catalogItems);
      }catch(e){ /* picker stays empty */ }
    }
    const pickerList = document.getElementById('pickerList');
    const PICK_CAP = 40;
    function renderPicker(list){
      if(catalogItems.length===0){ pickerList.innerHTML = `<div class="picker-empty">No catalog items yet. Use “New item” to add one.</div>`; return; }
      const shown = list.slice(0, PICK_CAP);
      let html = shown.map(p=>{
        const img = p.photoURL ? `<img src="${p.photoURL}" alt="">` : `<span class="nopic">No photo</span>`;
        const sub = [p.shortCode, p.category].filter(Boolean).map(escapeHtml).join(' · ');
        return `<div class="pick-item" data-id="${p.id}">${img}
          <div><div class="pi-name">${escapeHtml(p.itemName)}</div>${sub?`<div class="pi-code">${sub}</div>`:''}</div></div>`;
      }).join('');
      if(list.length===0) html = `<div class="picker-empty">No match. Try another word or use “New item”.</div>`;
      else if(list.length>PICK_CAP) html += `<div class="picker-empty">Showing ${PICK_CAP} of ${list.length}. Keep typing to narrow.</div>`;
      pickerList.innerHTML = html;
      pickerList.querySelectorAll('.pick-item').forEach(el=>{
        el.addEventListener('click', ()=> selectCatalogItem(el.dataset.id));
      });
    }
    document.getElementById('pickerSearch').addEventListener('input', e=>{
      const t = e.target.value.trim().toLowerCase();
      renderPicker(!t ? catalogItems : catalogItems.filter(p=>
        (p.itemName||'').toLowerCase().includes(t) ||
        (p.itemCode||'').toLowerCase().includes(t) ||
        (p.shortCode||'').toLowerCase().includes(t) ||
        (p.category||'').toLowerCase().includes(t)));
    });

    const selectedBanner = document.getElementById('selectedBanner');
    const pickerArea = document.getElementById('pickerArea');
    function selectCatalogItem(id){
      const item = catalogItems.find(p=>p.id===id);
      if(!item) return;
      selectedCatalogItem = item;
      document.getElementById('sbImg').innerHTML = item.photoURL ? `<img src="${item.photoURL}" alt="">` : `<span class="nopic">No photo</span>`;
      document.getElementById('sbName').textContent = item.itemName;
      selectedBanner.style.display = 'flex';
      pickerArea.style.display = 'none';
      renderColorChips(item.colors || []);
    }
    document.getElementById('sbClear').addEventListener('click', ()=>{
      selectedCatalogItem = null;
      selectedBanner.style.display = 'none';
      pickerArea.style.display = 'block';
      renderColorChips([]);
    });

    // colour quick-pick chips
    function renderColorChips(colors){
      const box = document.getElementById('colorChips');
      box.innerHTML = colors.map(c=>`<button type="button" class="cc">${escapeHtml(c)}</button>`).join('');
      box.querySelectorAll('.cc').forEach(b=> b.addEventListener('click', ()=> document.getElementById('colorInput').value = b.textContent));
    }

    // ---- new item photo ----
    const photoInput = document.getElementById('photoInput');
    const photoPick = document.getElementById('photoPick');
    photoPick.addEventListener('click', ()=>photoInput.click());
    photoInput.addEventListener('change', ()=>{
      const f = photoInput.files[0]; if(!f) return;
      selectedFile = f;
      const r = new FileReader();
      r.onload = e=>{ photoPick.innerHTML = `<img src="${e.target.result}" alt=""><p class="hint" style="margin-top:8px">Tap to change photo</p>`; };
      r.readAsDataURL(f);
    });

    function compressImage(file, maxW=1000, q=0.8){
      return new Promise((res,rej)=>{
        const img=new Image(), reader=new FileReader();
        reader.onload=e=>img.src=e.target.result; reader.onerror=rej;
        img.onload=()=>{ let w=img.width,h=img.height; if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
          const c=document.createElement('canvas'); c.width=w; c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          c.toBlob(b=>b?res(b):rej(new Error('compress')),'image/jpeg',q); };
        img.onerror=rej; reader.readAsDataURL(file);
      });
    }
    async function uploadPhoto(file){
      const blob = await compressImage(file);
      const fd = new FormData(); fd.append('image', blob, 'bag.jpg');
      const r = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {method:'POST', body:fd});
      const j = await r.json();
      if(!j.success) throw new Error('Photo upload failed');
      return j.data.url;
    }

    // ---- save request ----
    const saveBtn=document.getElementById('saveBtn'), saveSpinner=document.getElementById('saveSpinner'), saveText=document.getElementById('saveText'), formMsg=document.getElementById('formMsg');
    function showFormError(t){ formMsg.textContent=t; formMsg.style.display='block'; }
    function setSaving(on,label){ saveBtn.disabled=on; saveSpinner.style.display=on?'block':'none'; saveText.textContent=on?(label||'Saving…'):"Add to tomorrow's list"; }

    saveBtn.addEventListener('click', async ()=>{
      formMsg.style.display='none';
      const qty = document.getElementById('qtyInput').value.trim();
      const color = document.getElementById('colorInput').value.trim();
      const notes = document.getElementById('notesInput').value.trim();

      if(!qty || Number(qty) < 1){ showFormError('Please enter a quantity.'); return; }

      let itemName='', itemCode='', photoURL='', catalogId=null;

      if(mode==='catalog'){
        if(!selectedCatalogItem){ showFormError('Please pick a bag from the catalog, or switch to “New item”.'); return; }
        itemName = selectedCatalogItem.itemName;
        itemCode = selectedCatalogItem.itemCode || '';
        photoURL = selectedCatalogItem.photoURL || '';
        catalogId = selectedCatalogItem.id;
      }else{
        itemName = document.getElementById('newName').value.trim();
        itemCode = document.getElementById('newCode').value.trim();
        if(!itemName){ showFormError('Please enter the bag name.'); return; }
      }

      try{
        setSaving(true, selectedFile ? 'Uploading photo…' : 'Saving…');
        // new item: upload photo + save to catalog for reuse
        if(mode==='new'){
          if(selectedFile){ photoURL = await uploadPhoto(selectedFile); }
          setSaving(true,'Saving…');
          const catRef = await addDoc(collection(db,'catalog'),{
            itemName, itemCode, colors: color?[color]:[], parLevel:null,
            photoURL, createdBy: currentUser.email, createdAt: serverTimestamp()
          });
          catalogId = catRef.id;
        }

        await addDoc(collection(db,'reorders'),{
          itemName, itemCode, photoURL, catalogId,
          quantity: Number(qty), color, notes,
          neededBy: tomorrowISO(),
          status: 'requested',
          requestedBy: currentUser.email,
          requestedAt: serverTimestamp()
        });

        resetForm();
        await Promise.all([loadCatalog(), loadReorders()]);
      }catch(e){
        showFormError(e.message || 'Could not save. Please try again.');
      }finally{ setSaving(false); }
    });

    function resetForm(){
      document.getElementById('qtyInput').value='';
      document.getElementById('colorInput').value='';
      document.getElementById('notesInput').value='';
      document.getElementById('newName').value='';
      document.getElementById('newCode').value='';
      document.getElementById('pickerSearch').value='';
      selectedCatalogItem=null; selectedFile=null; photoInput.value='';
      selectedBanner.style.display='none'; pickerArea.style.display='block';
      document.getElementById('colorChips').innerHTML='';
      photoPick.innerHTML = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.5-2h7L17 8h3v11H4V8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.8"/></svg><p>Tap to add a photo</p><p class="hint">Take a photo or choose from gallery</p>`;
      renderPicker(catalogItems);
      setMode('catalog');
      formMsg.style.display='none';
      formCard.classList.remove('open');
    }

    // ---- load reorders ----
    async function loadReorders(){
      try{
        const snap = await getDocs(query(collection(db,'reorders'), orderBy('requestedAt','desc')));
        reorders = snap.docs.map(d=>({id:d.id, ...d.data()}));
        renderList();
      }catch(e){
        document.getElementById('listWrap').innerHTML = `<div class="state"><h3>Couldn’t load</h3><p>${escapeHtml(e.message)}</p></div>`;
      }
    }

    // filters
    document.querySelectorAll('.filters button').forEach(b=>{
      b.addEventListener('click', ()=>{
        document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        currentFilter = b.dataset.f;
        renderList();
      });
    });

    const STATUS_LABEL = {requested:'Requested',approved:'Approved',dispatched:'Dispatched',partial:'Partly received',received:'Received'};
    const NEXT = {requested:'approved',approved:'dispatched'};
    const NEXT_LABEL = {requested:'Approve',approved:'Mark dispatched'};

    function renderList(){
      const wrap = document.getElementById('listWrap');
      updateListBar();
      let list = reorders;
      if(currentFilter==='pending') list = reorders.filter(r=>r.status!=='received');
      else if(currentFilter==='received') list = reorders.filter(r=>r.status==='received');

      if(list.length===0){
        wrap.innerHTML = `<div class="state"><h3>Nothing here</h3><p>${currentFilter==='pending'?'No pending requests. Tap “New request” to add one.':'No items to show.'}</p></div>`;
        return;
      }

      wrap.innerHTML = list.map(r=>{
        const img = r.photoURL ? `<img src="${r.photoURL}" alt="">` : `<span class="nopic">No photo</span>`;

        let badge = `<span class="badge b-${r.status}">${STATUS_LABEL[r.status]}</span>`;
        if(r.status==='partial' && r.receivedQty!=null){
          badge += `<span class="badge b-short">${r.quantity-r.receivedQty} pending</span>`;
        }else if(r.status==='received' && r.receivedQty!=null && r.receivedQty < r.quantity){
          badge += `<span class="badge b-short">Short ${r.receivedQty}/${r.quantity}</span>`;
        }

        const meta = [r.itemCode, r.color].filter(Boolean).map(escapeHtml).join(' · ');
        const notes = r.notes ? `<div class="req-notes">${escapeHtml(r.notes)}</div>` : '';

        let qtyText = `Qty: ${r.quantity}`;
        if(r.status==='partial' && r.receivedQty!=null) qtyText = `Qty: ${r.quantity} — received ${r.receivedQty}, ${r.quantity-r.receivedQty} still pending`;
        else if(r.status==='received' && r.receivedQty!=null && r.receivedQty < r.quantity) qtyText = `Qty: ${r.quantity} — received ${r.receivedQty}`;

        // stamp = latest action
        let stamp = `Requested by ${escapeHtml((r.requestedBy||'').split('@')[0])} · ${timeAgo(r.requestedAt)}`;
        if((r.status==='received'||r.status==='partial') && r.receivedBy) stamp = `Received by ${escapeHtml(r.receivedBy.split('@')[0])} · ${timeAgo(r.receivedAt)}`;
        else if(r.status==='dispatched' && r.dispatchedBy) stamp = `Dispatched by ${escapeHtml(r.dispatchedBy.split('@')[0])} · ${timeAgo(r.dispatchedAt)}`;
        else if(r.status==='approved' && r.approvedBy) stamp = `Approved by ${escapeHtml(r.approvedBy.split('@')[0])} · ${timeAgo(r.approvedAt)}`;

        const pipelineNext = NEXT[r.status];
        let actions = '';
        if(pipelineNext) actions += `<button class="act" data-id="${r.id}" data-next="${pipelineNext}">${NEXT_LABEL[r.status]}</button>`;
        if(r.status!=='received') actions += `<button class="act secondary" data-recv="${r.id}">${r.status==='partial'?'Receive more':'Receive'}</button>`;

        return `<div class="req">
          <div class="req-top">
            ${img}
            <div class="req-info">
              <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
                <span class="req-name">${escapeHtml(r.itemName)}${r.kind==='supply'?' <span class="badge b-supply">Supply</span>':''}</span>
              </div>
              ${meta?`<div class="req-meta">${meta}</div>`:''}
              <div class="req-qty">${qtyText}</div>
            </div>
            <div>${badge}</div>
          </div>
          ${notes}
          <div class="recv-form" id="recv-${r.id}">
            <div class="f"><label>Received so far (out of ${r.quantity})</label><input type="number" min="0" id="recvqty-${r.id}" value="${r.receivedQty!=null?r.receivedQty:r.quantity}"></div>
            <button class="act" data-confirm="${r.id}">Confirm</button>
          </div>
          <div class="req-foot">
            <span class="stamp">${stamp}<br>Needed by ${niceDate(r.neededBy)}</span>
            <div class="req-actions">${actions}</div>
          </div>
        </div>`;
      }).join('');

      // pipeline advance (approve / dispatch)
      wrap.querySelectorAll('.act[data-next]').forEach(btn=>{
        btn.addEventListener('click', ()=> advance(btn.dataset.id, btn.dataset.next));
      });
      // open receive form
      wrap.querySelectorAll('.act[data-recv]').forEach(btn=>{
        btn.addEventListener('click', ()=> document.getElementById('recv-'+btn.dataset.recv).classList.add('open'));
      });
      // confirm received qty
      wrap.querySelectorAll('.act[data-confirm]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.dataset.confirm;
          const qty = Number(document.getElementById('recvqty-'+id).value);
          advance(id, 'received', isNaN(qty)?null:qty);
        });
      });
    }

    async function advance(id, action, receivedQty){
      const patch = { status: action };
      const now = serverTimestamp();
      if(action==='approved'){ patch.approvedBy=currentUser.email; patch.approvedAt=now; }
      if(action==='dispatched'){ patch.dispatchedBy=currentUser.email; patch.dispatchedAt=now; }
      if(action==='received'){
        const r = reorders.find(x=>x.id===id);
        const total = (receivedQty==null) ? r.quantity : receivedQty;
        if(total >= r.quantity){ patch.status='received'; patch.receivedQty = r.quantity; }
        else { patch.status='partial'; patch.receivedQty = total; }   // shortfall stays pending
        patch.receivedBy=currentUser.email; patch.receivedAt=now;
      }
      try{
        await updateDoc(doc(db,'reorders',id), patch);
        await loadReorders();
      }catch(e){ alert('Could not update: ' + e.message); }
    }

    // ---- send / download the day's list ----
    function pendingList(){
      return reorders
        .filter(r=>r.status!=='received')
        .sort((a,b)=>{
          const ka = a.kind==='supply'?1:0, kb = b.kind==='supply'?1:0;   // bags first, supplies under them
          return ka-kb || (a.neededBy||'').localeCompare(b.neededBy||'') || (a.itemName||'').localeCompare(b.itemName||'');
        });
    }
    function pendingQty(r){
      return (r.status==='partial' && r.receivedQty!=null) ? (r.quantity - r.receivedQty) : r.quantity;
    }
    function updateListBar(){
      const n = pendingList().length;
      document.getElementById('lbCount').textContent = n;
      document.getElementById('listBar').style.display = n>0 ? 'block':'none';
    }
    function listText(){
      const items = pendingList();
      const today = new Date().toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
      const lines = [];
      lines.push(`*Isuru Bag Center \u2014 Reorder list*`);
      lines.push(`_${today}_`);
      lines.push('');
      items.forEach((r,i)=>{
        let line = `${i+1}. ${pendingQty(r)}\u00d7 ${r.itemName}`;
        const ex = [r.color, r.itemCode].filter(Boolean);
        if(ex.length) line += ` (${ex.join(', ')})`;
        lines.push(line);
        if(r.notes) lines.push(`   - ${r.notes}`);
      });
      lines.push('');
      lines.push(`Total: ${items.length} item${items.length===1?'':'s'}`);
      return lines.join('\n');
    }
    document.getElementById('sendWaBtn').addEventListener('click', ()=>{
      if(pendingList().length===0){ alert('No pending items to send.'); return; }
      // no phone number -> WhatsApp lets you pick the warehouse group or person
      window.open(`https://wa.me/?text=${encodeURIComponent(listText())}`,'_blank');
    });

    document.getElementById('saveImgBtn').addEventListener('click', saveListImage);

    document.getElementById('printListBtn').addEventListener('click', printList);
    function printList(){
      const items = pendingList();
      if(items.length===0){ alert('No pending items to print.'); return; }
      const today = new Date().toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
      const tomorrow = niceDate(tomorrowISO());
      const rows = items.map((r,i)=>{
        const dt = [`${pendingQty(r)} pcs`, r.color, r.itemCode].filter(Boolean).map(escapeHtml).join('  \u00b7  ');
        const nt = r.notes ? `<div class="nt">Note: ${escapeHtml(r.notes)}</div>` : '';
        return `<div class="pl-item"><div class="nm">${i+1}. ${escapeHtml(r.itemName)}</div><div class="dt">${dt}</div>${nt}</div>`;
      }).join('');
      const pa = document.getElementById('printArea');
      pa.innerHTML = `<div class="pl-doc">
        <img class="pl-logo" src="logo.png" alt="">
        <div class="pl-head">
          <h1>Isuru Bag Center</h1>
          <p>No 08, 5th Cross Street, Ambalangoda<br>0715 830 023 / 0769 837 001</p>
        </div>
        <div class="pl-title">REORDER LIST</div>
        <div class="pl-date">${today}</div>
        ${rows}
        <div class="pl-total">Total: ${items.length} item${items.length===1?'':'s'}</div>
        <div class="pl-deliver">Please deliver by: ${tomorrow}</div>
        <div class="pl-sign">Handed over: ___________________<br>Received: ___________________<br>Date: ___________</div>
      </div>`;
      const img = pa.querySelector('img');
      if(img && !img.complete){ img.onload=()=>window.print(); img.onerror=()=>window.print(); }
      else window.print();
    }
    async function saveListImage(){
      const items = pendingList();
      if(items.length===0){ alert('No pending items to save.'); return; }
      try{ await document.fonts.ready; }catch(e){}
      const today = new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
      const W=820, pad=44, rowH=66, headerH=158, footerH=72;
      const H=headerH + items.length*rowH + footerH, scale=2;
      const c=document.createElement('canvas'); c.width=W*scale; c.height=H*scale;
      const ctx=c.getContext('2d'); ctx.scale(scale,scale);
      const F=(w,s)=>`${w} ${s}px "Plus Jakarta Sans", system-ui, sans-serif`;
      const fit=(t,maxW)=>{ if(ctx.measureText(t).width<=maxW) return t; let s=t; while(s.length>1 && ctx.measureText(s+'\u2026').width>maxW) s=s.slice(0,-1); return s+'\u2026'; };
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#1A3A7A'; ctx.fillRect(0,0,W,headerH);
      ctx.fillStyle='#fff'; ctx.font=F(800,32); ctx.fillText('Isuru Bag Center', pad, 60);
      ctx.font=F(600,21); ctx.fillText('Reorder List', pad, 96);
      ctx.fillStyle='rgba(255,255,255,.82)'; ctx.font=F(400,16); ctx.fillText(today, pad, 126);
      let y=headerH+34;
      items.forEach((r,i)=>{
        if(i%2===0){ ctx.fillStyle='#F5F7F6'; ctx.fillRect(pad-14, y-26, W-2*(pad-14), rowH-6); }
        ctx.fillStyle='#1A3A7A'; ctx.font=F(800,23); ctx.fillText(`${pendingQty(r)}\u00d7`, pad, y);
        ctx.fillStyle='#12211F'; ctx.font=F(600,19); ctx.fillText(fit(r.itemName||'', W-pad-160), pad+74, y-6);
        const sub=[r.color, r.itemCode, r.notes].filter(Boolean).join('   \u00b7   ');
        if(sub){ ctx.fillStyle='#6B7C79'; ctx.font=F(400,15); ctx.fillText(fit(sub, W-pad-170), pad+74, y+18); }
        y+=rowH;
      });
      ctx.fillStyle='#6B7C79'; ctx.font=F(700,16);
      ctx.fillText(`Total: ${items.length} item${items.length===1?'':'s'}`, pad, H-30);
      ctx.textAlign='right'; ctx.fillStyle='#9AA7A4'; ctx.font=F(500,14);
      ctx.fillText('Generated by Isuru Bag Center app', W-pad, H-30); ctx.textAlign='left';
      c.toBlob(blob=>{
        if(!blob){ alert('Could not create image.'); return; }
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download=`reorder-list-${new Date().toISOString().slice(0,10)}.png`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
      }, 'image/png');
    }
    // open the form automatically when arriving from a dashboard quick action
    if(new URLSearchParams(location.search).get('new')==='1'){
      const t=document.getElementById('toggleNew');
      if(t && !document.getElementById('formCard').classList.contains('open')) t.click();
    }
  </script>
</body>
</html>
